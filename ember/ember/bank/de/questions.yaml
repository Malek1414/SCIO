candidates:
  # ── Slot 2 · Fire · threat 4–5 · keine Voraussetzungen erlaubt ──────────────
  - id: F1-a
    slot: 2
    cluster: fire
    targets: [F1]
    threat: 4
    framing: counterfactual-removal
    default: true
    text: >-
      Stell dir vor, Geld ist für immer geregelt — Miete, Essen, Familie, alles.
      Es ist ein ganz normaler Dienstag. Was machst du um zwei Uhr nachmittags?
    rephrase: >-
      Wenn Geld nie wieder ein Problem wäre: Was würdest du an einem normalen
      Nachmittag wirklich machen?
  - id: F1-b
    slot: 2
    cluster: fire
    targets: [F1]
    threat: 5
    framing: envy-locator
    text: Wessen Leben würdest du gegen deins tauschen, wenn es niemand mitbekommt?
    rephrase: "Wen kennst du, bei dem du dir denkst: So hätte ich es auch gern?"
  - id: F3-c
    slot: 2
    cluster: fire
    targets: [F3]
    threat: 4
    framing: third-person-projection
    text: >-
      Denk an die talentierteste Person, die du kennst und die trotzdem nicht vorankommt.
      Was ist die eine Sache, die sie nicht macht?
    rephrase: >-
      Die begabteste Person, die du kennst, kommt trotzdem nicht weiter.
      Wovor drückt sie sich?

  # ── Slot 3 · Fire · threat 5–6 ──────────────────────────────────────────────
  - id: F2-a
    slot: 3
    cluster: fire
    targets: [F2]
    threat: 5
    framing: cost-already-paid
    default: true
    text: >-
      Was hast du für die Sache, die dir wichtig ist, schon aufgegeben — etwas, das die
      Leute um dich herum nicht verstanden haben?
    rephrase: >-
      Was hat dich das, was du willst, bisher gekostet? Zeit, Geld, Menschen?
  - id: F2-b
    slot: 3
    cluster: fire
    targets: [F2]
    threat: 6
    framing: cost-already-paid
    prerequisites: [relationship]
    text: >-
      Du hast jemanden erwähnt, der dir nahesteht. Was hat dich dein Ehrgeiz bei dieser
      Person schon gekostet?
    rephrase: >-
      Die Person, die du erwähnt hast — wo ist dir dein Ehrgeiz dort in die Quere gekommen?
  - id: F3-a
    slot: 3
    cluster: fire
    targets: [F3]
    threat: 5
    framing: settled-person-read
    text: >-
      Denk an jemanden, der es sich bequem gemacht hat und gar nicht mehr versucht,
      weiterzukommen. Wie ist es, Zeit mit dieser Person zu verbringen?
    rephrase: >-
      Jemand, der aufgehört hat, es überhaupt zu versuchen: Wie fühlt sich ein Abend
      mit dem an?
  - id: F1-d
    slot: 3
    cluster: fire
    targets: [F1]
    threat: 5
    framing: discrepancy
    prerequisites: [money]
    text: >-
      Du hast vorhin Geld erwähnt. Angenommen, die Sache, die du willst, bringt nie Geld
      ein — was ändert sich dann?
    rephrase: Nimm das Geld komplett raus. Was bleibt von dem Wunsch übrig?
  - id: F1-c
    slot: 3
    cluster: fire
    targets: [F1, F3]
    threat: 5
    framing: third-person-projection
    prerequisites: [named-project]
    text: >-
      Du hast etwas erwähnt, woran du arbeitest. Stell dir vor, es funktioniert wirklich —
      was passiert in dem Moment in dir?
    rephrase: Das, woran du arbeitest — was spürst du in dem Moment, in dem es klappt?

  # ── Slot 4 · Fire tief · threat 6–7 ─────────────────────────────────────────
  - id: F2-c
    slot: 4
    cluster: fire
    targets: [F2, F3]
    threat: 7
    framing: cost-already-paid
    default: true
    text: >-
      Sagen wir, es klappt und du bekommst genau das, was du beschrieben hast.
      Was für ein Mensch musstest du dafür werden — und willst du dieser Mensch sein?
    rephrase: >-
      Wenn du alles bekommst, was du willst: Was hat es dich als Mensch gekostet?
  - id: F3-b
    slot: 4
    cluster: fire
    targets: [F3]
    threat: 6
    framing: forking
    prerequisites: [failure]
    text: >-
      Du hast etwas erwähnt, das nicht funktioniert hat. Lag es daran, dass es gescheitert
      ist — oder daran, dass du aufgehört hast?
    rephrase: >-
      Diese Sache, die nicht geklappt hat: Was hat sie wirklich beendet — das Scheitern
      oder dein Aufhören?
  - id: F1-e
    slot: 4
    cluster: fire
    targets: [F1]
    threat: 7
    framing: aftermath-not-event
    prerequisites: [quit]
    text: >-
      Du hast gesagt, du hast etwas hingeschmissen. Wovon bist du damit in Wirklichkeit
      weggegangen?
    rephrase: Als du aufgehört hast — was hast du damit eigentlich hinter dir gelassen?

  # ── Slot 5 · Compass ────────────────────────────────────────────────────────
  - id: C1-a
    slot: 5
    cluster: compass
    targets: [C1]
    threat: 6
    framing: pressure-decision
    default: true
    text: >-
      Denk an das letzte Mal, als du dich schnell entscheiden musstest und deine
      Entscheidung jemand anderen etwas gekostet hat. Wie hast du dich entschieden?
    rephrase: >-
      Eine schnelle Entscheidung, die jemanden etwas gekostet hat: Wofür hast du dich
      entschieden, und warum so?
  - id: C2-a
    slot: 5
    cluster: compass
    targets: [C2]
    threat: 5
    framing: scale-of-things
    text: Wovon bist du ein kleiner Teil, das größer ist als du selbst?
    rephrase: Wozu gehörst du, das größer ist als dein eigenes Leben?
  - id: C2-b
    slot: 5
    cluster: compass
    targets: [C2]
    threat: 6
    framing: forking
    prerequisites: [faith]
    text: >-
      Du hast deinen Glauben erwähnt. Wenn dein Glaube und das, was du willst, in
      verschiedene Richtungen gehen — welches von beidem gibt nach?
    rephrase: >-
      Wenn Glaube und Ehrgeiz sich widersprechen: Welcher von beiden weicht bei dir zurück?
  - id: C3-a
    slot: 5
    cluster: compass
    targets: [C3]
    threat: 6
    framing: fear-of-self
    text: >-
      Was für ein Mensch willst du auf keinen Fall werden — und warum macht dir genau
      der Angst?
    rephrase: Beschreib die Version von dir selbst, die du unbedingt vermeiden willst.
  - id: C1-b
    slot: 5
    cluster: compass
    targets: [C1]
    threat: 6
    framing: discrepancy
    prerequisites: [family]
    text: >-
      Du hast vorhin deine Familie erwähnt. Nach welcher Regel lebst du, von der deine
      Familie sagen würde, dass du dich selbst nicht daran hältst?
    rephrase: >-
      Was glaubst du übers Leben, bei dem deine Familie sagen würde: Daran hältst du dich
      selbst nicht?

  # ── Slot 6 · Ground ─────────────────────────────────────────────────────────
  - id: G1-a
    slot: 6
    cluster: ground
    targets: [G1]
    threat: 5
    framing: empty-room
    default: true
    text: >-
      Du sitzt allein in einem Raum, das Handy ist leer, und sechs Stunden lang kommt
      niemand. Nach vierzig Minuten — was machst du dann mit dir?
    rephrase: Sechs Stunden allein, ohne Handy. Was passiert in dieser Zeit in deinem Kopf?
  - id: G2-a
    slot: 6
    cluster: ground
    targets: [G2]
    threat: 6
    framing: aftermath-not-event
    text: >-
      Irgendetwas hat dich mal richtig aus der Bahn geworfen. Nicht das Ereignis selbst
      interessiert mich, sondern: Was hast du dir danach wieder aufgebaut?
    rephrase: >-
      Nach dem Schlimmsten, das dir passiert ist: Was hast du danach anders gemacht?
  - id: G2-b
    slot: 6
    cluster: ground
    targets: [G2]
    threat: 7
    framing: aftermath-not-event
    prerequisites: [loss]
    text: >-
      Du hast erwähnt, dass du etwas verloren hast. Was hast du dir danach vorgenommen,
      ohne es jemals jemandem zu sagen?
    rephrase: Nach diesem Verlust — was hast du still für dich beschlossen?
  - id: G3-a
    slot: 6
    cluster: ground
    targets: [G3]
    threat: 5
    framing: people-as
    text: >-
      Denk an einen Tag, an dem du richtig in Bestform bist. Was machen an so einem Tag
      die Menschen, die dir am nächsten stehen?
    rephrase: >-
      An deinem besten Tag: Wo sind die Menschen, die du liebst, und was tun sie gerade?
  - id: G3-b
    slot: 6
    cluster: ground
    targets: [G3]
    threat: 6
    framing: people-as
    prerequisites: [solitude]
    text: Du hast gesagt, du verbringst viel Zeit allein. Wer weiß das von dir?
    rephrase: So viel Zeit allein — wer aus deinem Umfeld weiß das überhaupt?
