text: >-
  Denk an jemanden, den du persönlich kennst und von dem du überzeugt bist, dass er es
  schaffen wird. Keine berühmte Person — jemand aus deinem echten Leben.
  Was macht diese Person anders als alle anderen?
rephrase: >-
  Jemand aus deinem Umfeld, von dem du sicher bist, dass er es schafft.
  Was macht diese Person an einem ganz normalen Dienstag anders als du?
fallback_take_home: >-
  Was müsstest du aufhören zu tun, um die Person zu werden, die du zuerst beschrieben hast?
