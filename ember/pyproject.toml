[project]
name = "ember"
version = "0.1.0"
description = "Maieutic voice interview with a decoupled diagnostic observer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.5.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.scripts]
ember = "ember.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the whisper model or runs ffmpeg",
    "api: calls the Claude Agent SDK unless recordings exist",
]
